set-option -g status-style fg=default,bg=default
set-option -g prefix C-b
set -g mouse on
set-window-option -g mode-keys vi

bind h select-window -t 0
bind j select-window -t 1
bind k select-window -t 2
bind l select-window -t 3

set -g pane-active-border-style fg='#000000'
set -g pane-border-style fg='#000000'
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"
