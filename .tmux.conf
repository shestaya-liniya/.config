set-option -g status-style fg=default,bg=default
set-option -g prefix C-b
set -g mouse on
set-window-option -g mode-keys vi
set -g window-status-separator " | "

set -g pane-active-border-style fg='#000000'
set -g pane-border-style fg='#000000'
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"

set -g status-left-length 100
set -g automatic-rename-format '/#(basename "#{pane_current_path}") #{pane_current_command}'
set -g window-status-current-format '#[fg=yellow,bold] #I:#W '

run-shell tmux/resurrect/resurrect.tmux
